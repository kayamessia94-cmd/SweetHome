<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Residences · 3D Tower Showcase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400&family=Montserrat:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===== Sweet Home palette (from the site CSS) ===== */
:root{--dark:rgb(48,39,29);--cream:antiquewhite;--bg:#faebd7;--bg2:#fff8ee;--ink:#30271d;--mute:rgba(48,39,29,.65);--brand:rgb(48,39,29);--brand-ink:antiquewhite;--line:rgba(48,39,29,.35);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:radial-gradient(ellipse at 50% 28%,var(--bg2),var(--bg) 62%,#ebd3ae);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300;overflow:hidden}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;height:70px;padding:0 24px;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#020202;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;pointer-events:none}
nav b{font-weight:500;letter-spacing:.3em}
nav .cta{background:var(--dark);border:2px solid var(--dark);color:var(--cream);border-radius:25px;padding:14px 22px}
.view{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .7s ease;background:radial-gradient(ellipse at 50% 28%,var(--bg2),var(--bg) 62%,#ebd3ae)}
#carousel,#building{background:none}
.view.on{opacity:1;pointer-events:auto}
.title{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;padding:0 24px;z-index:5;pointer-events:none}
.title h2{font-size:clamp(28px,6vw,48px);font-weight:400}
.title p{color:var(--mute);font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:8px}
.arrow{position:absolute;top:50%;z-index:6;width:44px;height:44px;margin-top:-22px;border:2px solid var(--line);border-radius:50%;background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font-size:22px;cursor:pointer}
.arrow.l{left:16px}.arrow.r{right:16px}
.tip{color:antiquewhite;position:fixed;z-index:30;background:rgba(48,39,29,.92);border:1px solid var(--line);border-radius:15px;padding:10px 14px;font-size:11px;letter-spacing:.12em;pointer-events:none;opacity:0;transition:opacity .2s;text-transform:uppercase}
.tip em{display:block;font-style:normal;color:#e8c99a;font-size:10px;margin-top:3px}
.back{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--dark);border:2px solid var(--dark);border-radius:25px;color:var(--cream);padding:14px 22px;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:transform .3s,background .3s,color .3s}
.back:hover{background:transparent;color:var(--dark);transform:translateY(-3px)}
#tour .back{background:antiquewhite;border-color:antiquewhite;color:var(--dark)}
#tour .back:hover{background:transparent;color:antiquewhite}
#building .back,#plan .back{bottom:auto;top:calc(88px + env(safe-area-inset-top,0px))}
#plan{display:flex;flex-direction:column;align-items:center;justify-content:center}
#psvg{width:min(900px,92%);height:56%;background:#fffaf2;border:2px solid var(--dark);border-radius:25px;padding:10px;margin-top:70px}
.room{cursor:pointer;transition:filter .25s}
.room:hover{filter:brightness(1.35)}
.lbl{fill:var(--dark);font-size:11px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;text-anchor:middle}
#plan .title{position:static;margin-top:6px}
#tour{background:#000}
.scene{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1.1s ease,transform 6s ease;background-size:cover;background-position:center}
.scene.on{opacity:1;transform:scale(1)}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.7))}
.cap,.cap h3{color:antiquewhite}
.cap{position:absolute;left:24px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5}
.cap small{display:block;color:antiquewhite;font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:6px}
.cap h3{font-size:clamp(30px,7vw,56px);font-weight:400}
.tabs{position:absolute;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px}
.tabs button{width:34px;height:34px;border:2px solid var(--line);border-radius:50%;background:rgba(48,39,29,.5);color:antiquewhite;cursor:pointer;font:inherit;font-size:11px}
.tabs button.on{background:antiquewhite;color:var(--dark)}
@media(max-width:640px){.back{left:16px}.tabs{right:16px}.cap{left:16px}nav .cta{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<nav><b class="serif" style="font-size:15px">RESIDENCES</b><span class="cta">Private Tour</span></nav>

<section id="carousel" class="view on">
  <div class="title"><h2 class="serif" id="cname"></h2><p>Swipe · tap a tower to enter</p></div>
  <button class="arrow l" id="prev" aria-label="Previous">‹</button>
  <button class="arrow r" id="next" aria-label="Next">›</button>
</section>

<section id="building" class="view">
  <div class="title"><h2 class="serif" id="bname"></h2><p>Drag to rotate · tap a level</p></div>
  <button class="back" data-go="carousel">← Buildings</button>
</section>

<section id="plan" class="view">
  <svg id="psvg" viewBox="190 50 470 280"></svg>
  <div class="title"><h2 class="serif" id="ptitle"></h2><p>Tap a room to step inside</p></div>
  <button class="back" data-go="building">← Tower</button>
</section>

<section id="tour" class="view">
  <div id="scenes"></div>
  <div class="cap"><small id="csm"></small><h3 class="serif" id="cti"></h3></div>
  <div class="tabs" id="tabs"></div>
  <button class="back" data-go="plan">← Floor plan</button>
</section>
<div class="tip" id="tip"></div>

/* ---- procedural textures ---- */
const rnd = (()=>{ let s = 11; return ()=> (s = s*16807 % 2147483647)/2147483647; })();
function cv(w,h,fn){ const c = document.createElement("canvas"); c.width = w; c.height = h; fn(c.getContext("2d"),w,h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }
const T_CONC = cv(128,128,(x,w,h)=>{ x.fillStyle="#e4ded1"; x.fillRect(0,0,w,h); for(let i=0;i<900;i++){ x.fillStyle=`rgba(${rnd()>.5?"90,80,66":"255,255,250"},${.04+rnd()*.07})`; x.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2); } });
const T_PANEL = cv(128,128,(x,w,h)=>{ x.fillStyle="#f3f0e9"; x.fillRect(0,0,w,h); x.strokeStyle="rgba(70,62,50,.35)"; x.lineWidth=1.5; for(let i=0;i<=w;i+=64){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,h); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(w,i); x.stroke(); } });
const T_PLANK = cv(128,128,(x,w,h)=>{ for(let r=0;r<16;r++){ const y = r*8; let px = 0; while(px<w){ const len = 30+rnd()*60, l = 38+rnd()*14; x.fillStyle=`hsl(${24+rnd()*8},${55+rnd()*10}%,${l}%)`; x.fillRect(px,y,len,7); x.fillStyle="rgba(0,0,0,.35)"; x.fillRect(px,y+7,len,1); x.fillRect(px,y,1,8); px += len; } } });
T_CONC.repeat.set(2,1); T_PANEL.repeat.set(2,1); T_PLANK.repeat.set(1.5,1);
function makeEnv(){
  const c = document.createElement("canvas"); c.width = 512; c.height = 256; const x = c.getContext("2d"), g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,"#78aef0"); g.addColorStop(.45,"#fdf1de"); g.addColorStop(.55,"#ead4ae"); g.addColorStop(1,"#a88c66"); x.fillStyle = g; x.fillRect(0,0,512,256);
  x.fillStyle = "#fff"; x.beginPath(); x.arc(380,70,24,0,7); x.fill();
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer), e = pm.fromEquirectangular(t).texture; t.dispose(); pm.dispose(); return e;
}
scene.environment = makeEnv();

const BASE = {

  panel: {color:0xffffff, map:T_PANEL, roughness:.75},

  wood:  {color:0xffffff, map:T_PLANK, roughness:.65},
  wood2: {color:0x9c5f2b, roughness:.55},
  soffit:{color:0x6a4326, roughness:.7},
  glass: {color:0x7fa6c2, roughness:.06, metalness:.85, transparent:true, opacity:.55, envMapIntensity:1.5},

function mats(){ const o = {}; for(const k in BASE){ const m = new THREE.MeshStandardMaterial(BASE[k]); m.userData.e0 = m.emissive.clone(); m.userData.i0 = m.emissiveIntensity; if(k!=="glass"&&k!=="rail") m.envMapIntensity = .4; o[k] = m; } return o; }

/* ---- helpers ---- */
const UNIT = new THREE.BoxGeometry(1,1,1), ICO = new THREE.IcosahedronGeometry(1,0), _o = new THREE.Object3D();
const bx = (w,h,d,m,x,y,z)=>{ const o = new THREE.Mesh(UNIT,m); o.scale.set(w,h,d); o.position.set(x,y,z); return o; };
function inst(geo,mat,items){
  const im = new THREE.InstancedMesh(geo,mat,items.length);
  items.forEach((it,i)=>{ _o.position.set(it.x,it.y,it.z); _o.rotation.set(0,it.ry||0,0); _o.scale.set(it.sx||1,it.sy||1,it.sz||1); _o.updateMatrix(); im.setMatrixAt(i,_o.matrix); });
  return im;
}
function slats(m,cx,cy,cz,w,h,n,dep,ry=0){
  const it = []; for(let i=0;i<n;i++){ const u = (i+.5)/n-.5; it.push({x:cx+Math.cos(ry)*u*w, y:cy, z:cz-Math.sin(ry)*u*w, ry, sx:w/n*.55, sy:h, sz:dep}); }
  return inst(UNIT,m,it);
}
const bushes = (m,list)=> inst(ICO,m,list.map(p=>({x:p.x,y:p.y,z:p.z,ry:rnd()*6,sx:p.s,sy:p.s*.75,sz:p.s})));
function seg(m,g,x1,z1,x2,z2,y,h,th=.03){
  const L = Math.hypot(x2-x1,z2-z1), o = bx(L,h,th,m,(x1+x2)/2,y,(z1+z2)/2); o.rotation.y = Math.atan2(-(z2-z1),x2-x1); g.add(o);
}
function glassRail(m,g,x1,z1,x2,z2,y){ seg(m.rail,g,x1,z1,x2,z2,y+.2,.4); seg(m.dark,g,x1,z1,x2,z2,y+.41,.03,.05); }
function balus(m,g,x1,z1,x2,z2,y,h){
  const L = Math.hypot(x2-x1,z2-z1), n = Math.max(2,Math.round(L/.14)), it = [];
  for(let i=0;i<=n;i++){ const u = i/n; it.push({x:x1+(x2-x1)*u, y:y+h/2, z:z1+(z2-z1)*u, sx:.02, sy:h, sz:.02}); }
  g.add(inst(UNIT,m.dark,it)); seg(m.dark,g,x1,z1,x2,z2,y+h,.035,.05); seg(m.dark,g,x1,z1,x2,z2,y+.03,.03,.04);
}
function win(m,g,x,y,z,w,h,ry=0,rows=1){
  const wg = new THREE.Group(); wg.position.set(x,y,z); wg.rotation.y = ry;
  wg.add(bx(w+.1,h+.1,.06,m.dark,0,0,0)); wg.add(bx(w,h,.05,m.glass,0,0,.02)); wg.add(bx(w*.95,h*.95,.02,m.glow,0,0,-.02));
  wg.add(bx(.03,h,.06,m.dark,0,0,.045));
  for(let r=1;r<=rows;r++) wg.add(bx(w,.03,.06,m.dark,0,-h/2+h*r/(rows+1),.045));
  g.add(wg);
}
function tree(m,g,x,y,z,s=1){
  const t = bx(.07*s,.7*s,.07*s,m.soffit,x,y+.35*s,z); g.add(t);
  [[0,.95,0,.42],[.2,.75,.1,.3],[-.2,.8,-.1,.32]].forEach(([a,b,c,r])=>{ const o = new THREE.Mesh(ICO,m.green); o.scale.setScalar(r*s); o.position.set(x+a*s,y+b*s,z+c*s); g.add(o); });
}
function cypress(m,g,x,z,s=1){
  const o = new THREE.Mesh(new THREE.ConeGeometry(.3*s,3.6*s,10),m.green2); o.position.set(x,.2+1.8*s,z); g.add(o);
}
function ext(pts,depth,m,hole){
  const sh = new THREE.Shape(pts); if(hole) sh.holes.push(new THREE.Path(hole.slice().reverse()));
  const g = new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false,curveSegments:1}); g.rotateX(-Math.PI/2); return new THREE.Mesh(g,m);
}
function blobPts(a,b,phi,sc=1,n=72){
  const p = []; for(let k=0;k<n;k++){ const t = k/n*Math.PI*2;
    p.push(new THREE.Vector2(Math.cos(t)*a*sc*(1+.1*Math.sin(2*t+phi)), Math.sin(t)*b*sc*(1+.09*Math.sin(3*t+phi*1.3)))); }
  return p;
}

    g.add(bx(2.6,.14,.3,m.conc2,ox,.27,1.05));
    g.add(bushes(m.green,Array.from({length:7},(_,k)=>({x:ox-1.1+k*.37,y:.4,z:1.05,s:.13+rnd()*.05}))));
    g.add(slats(m.wood2,sx+s*.98,.675,-.4,2.5,.95,16,.08,Math.PI/2));
    if(top){ g.add(bx(5.2,.14,3.6,m.conc,0,1.22,0)); }
    return g; }},
  /* B — wavy slabs, continuous wood-slat balustrade, draped planting */
  B:{n:5,H:1.25,make(i,m,top){
    const g = new THREE.Group(), phi = i*.95, ox = Math.sin(i*.95)*.18, A = 2.9, Bz = 2.1;
    const slab = ext(blobPts(A,Bz,phi),.2,m.conc); slab.position.x = ox; g.add(slab);
    const pts = blobPts(A,Bz,phi,.985,72), it = [];
    pts.forEach((p,k)=>{ const q = pts[(k+1)%pts.length], pr = pts[(k+pts.length-1)%pts.length];
      it.push({x:p.x+ox, y:.4, z:-p.y, ry:Math.atan2(q.y-pr.y,q.x-pr.x), sx:.045, sy:.4, sz:.09}); });
    g.add(inst(UNIT,m.wood2,it));
    const topRail = ext(blobPts(A,Bz,phi,.99),.03,m.dark,blobPts(A,Bz,phi,.965)); topRail.position.set(ox,.6,0); g.add(topRail);
    const core = ext(blobPts(A,Bz,phi,.78),.86,m.glass); core.position.set(ox,.2,0); g.add(core);
    const glow = ext(blobPts(A,Bz,phi,.76),.84,m.glow); glow.position.set(ox,.2,0); g.add(glow);
    const roof = ext(blobPts(A,Bz,phi,.82),.05,m.dark); roof.position.set(ox,1.07,0); g.add(roof);
    [.5,1.9,3.5,5.0].forEach(t=>{
      const px = Math.cos(t)*A*.8*(1+.1*Math.sin(2*t+phi)), pz = Math.sin(t)*Bz*.8*(1+.09*Math.sin(3*t+phi*1.3));
      g.add(slats(m.wood2,px+ox,.63,-pz,.8,.84,8,.08,-t+Math.PI/2*0+0));
    });
    const bl = blobPts(A,Bz,phi,1.0,40).map((p,k)=>({x:p.x+ox,y:.62,z:-p.y,s:.14+(k%3)*.04}));
    g.add(bushes(m.green,bl));
    g.add(bushes(m.green2,blobPts(A,Bz,phi,1.02,28).map((p,k)=>({x:p.x+ox,y:.1,z:-p.y,s:.11+(k%2)*.03}))));
    if(top){ const cap = ext(blobPts(2.95,2.15,phi+.35),.15,m.conc); cap.position.set(ox,1.1,0); g.add(cap); }
    return g; }},
  /* C — offset wood / white boxes, grid windows, terraces with trees */
  C:{n:4,H:1.55,make(i,m,top){
    const g = new THREE.Group(), cx = i%2 ? .75 : -.75, cz = i%2 ? -.2 : .2, mat = i%2 ? m.panel : m.wood;
    g.add(bx(2.8,1.5,2.6,mat,cx,.75,cz));
    win(m,g,cx-.7,.85,cz+1.3,.55,1.05,0,2); win(m,g,cx+.5,.85,cz+1.3,.55,1.05,0,2);
    win(m,g,cx+1.4,.85,cz,.8,1.0,Math.PI/2,2); win(m,g,cx-1.4,.85,cz,.8,1.0,-Math.PI/2,2);
    if(!top){
      const e = i%2 ? 1 : -1;
      balus(m,g,cx-1.4,cz+1.3,cx+1.4,cz+1.3,1.5,.35); balus(m,g,cx-1.4,cz-1.3,cx+1.4,cz-1.3,1.5,.35);
      balus(m,g,cx+1.4,cz-1.3,cx+1.4,cz+1.3,1.5,.35); balus(m,g,cx-1.4,cz-1.3,cx-1.4,cz+1.3,1.5,.35);
      tree(m,g,cx+e*1.0,1.5,cz+.5,.8);
    } else { g.add(bx(2.95,.12,2.75,m.panel,cx,1.56,cz)); balus(m,g,cx-1.4,cz+1.3,cx+1.4,cz+1.3,1.62,.3); }
    return g; }},
  /* D — cantilevered zig-zag slabs, wood soffits, glass units */
  D:{n:5,H:1.3,make(i,m,top){
    const g = new THREE.Group(), o = i%2;
    g.add(bx(1.0,1.3,2.8,m.panel,-1.9,.65,0));
    g.add(bx(.04,.34,2.3,m.dark,-1.39,.85,0)); g.add(bx(.05,.28,2.2,m.glass,-1.38,.85,0));
    const pts = [new THREE.Vector2(-1.4,-1.3),new THREE.Vector2(3.0,o?-1.3:-.4),new THREE.Vector2(3.0,o?.4:1.3),new THREE.Vector2(-1.4,1.3)];
    g.add(ext(pts,.18,m.conc)); const so = ext(pts,.05,m.soffit); so.position.y = -.05; g.add(so);
    g.add(bx(2.4,.9,1.9,m.glass,.1,.65,0)); g.add(bx(2.3,.85,1.8,m.glow,.1,.65,-.03));
    for(let k=-2;k<=2;k++) g.add(bx(.04,.9,.05,m.dark,.1+k*.55,.65,.96));
    g.add(bx(2.5,.06,2.0,m.soffit,.1,1.13,0));
    for(let k=0;k<3;k++) glassRail(m,g,pts[k].x,-pts[k].y,pts[k+1].x,-pts[k+1].y,.18);
    const zA = -pts[1].y, zB = -pts[2].y, zc = (zA+zB)/2, len = Math.abs(zA-zB);
    g.add(bx(.3,.16,len,m.conc2,2.82,.26,zc));
    g.add(bushes(m.green,Array.from({length:6},(_,k)=>({x:2.85,y:.42,z:zc-len/2+(k+.5)*len/6,s:.15+rnd()*.05}))));
    g.add(bushes(m.green2,Array.from({length:5},(_,k)=>({x:3.05,y:.08,z:zc-len/2+(k+.5)*len/5,s:.12}))));
    if(top){ g.add(bx(5.3,.16,3.0,m.conc,.9,1.4,0)); g.add(bx(5.2,.05,2.9,m.soffit,.9,1.29,0));
      const sk = new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.03,32),m.glass); sk.scale.z = .7; sk.position.set(1.6,1.49,0); g.add(sk); tree(m,g,1.6,1.3,0,.9); }
    return g; }}
};
const KINDS = ["A","B","C","D"];

function buildModel(b,i){
  const K = LEVEL[KINDS[i]], root = new THREE.Group(), tower = new THREE.Group(); root.add(tower);
  root.userData.mi = i;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.4,.2,64), new THREE.MeshStandardMaterial({color:0xbfa57e,roughness:.85}));
  base.position.y = .1; root.add(base);
  const ringM = new THREE.Mesh(new THREE.TorusGeometry(4.3,.05,8,96), new THREE.MeshStandardMaterial({color:BRAND,roughness:.5}));
  ringM.rotation.x = Math.PI/2; ringM.position.y = .2; root.add(ringM);
  const M0 = mats();
  if(i===1){ cypress(M0,root,-3.4,.8,1); cypress(M0,root,3.5,1.2,1.1); cypress(M0,root,-3.0,-1.6,.9); }
  if(i===0){ tree(M0,root,-3.3,.2,1.6,1.3); tree(M0,root,3.3,.2,1.4,1.2); }
  if(i===2){ tree(M0,root,-3.2,.2,1.8,1.5); cypress(M0,root,3.4,1.0,.8); }
  if(i===3){ tree(M0,root,3.3,.2,2.0,1.1); tree(M0,root,-3.3,.2,1.9,1.2); }
  root.userData.levels = [];
  for(let l=0;l<K.n;l++){
    const g = K.make(l,mats(),l===K.n-1); g.userData.lvl = l; g.userData.y0 = .2 + l*K.H; g.position.y = g.userData.y0;
    g.userData.n = K.n; g.userData.off = new THREE.Vector3(); tower.add(g); root.userData.levels.push(g);
  }
  root.traverse(o=>{ if(o.isMesh){ o.receiveShadow = true; o.castShadow = !(o.material.transparent); } });
  return root;
}

const R = 6, step = Math.PI*2/N, ring = new THREE.Group(); scene.add(ring);
const models = BL.map((b,i)=>{ const m = buildModel(b,i), th = i*step; m.position.set(Math.sin(th)*R,0,Math.cos(th)*R); m.userData.th = th; ring.add(m); return m; });

/* camera */
let dC = 14, dD = 10;
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); cam.aspect = w/h; cam.updateProjectionMatrix();
  dC = Math.max(18, 9.5/(.7*cam.aspect)); dD = dC*.9;
}
addEventListener("resize", resize); resize();
const camPos = new THREE.Vector3(0,4.8,R+dC), camLook = new THREE.Vector3(0,3.2,R*.5);
cam.position.copy(camPos);

/* carousel state */
let ciRaw = 0, ringAng = 0, userRot = 0, hov = null;
const ci = () => ((Math.round(ciRaw)%N)+N)%N;
function spin(i){ let d = ((i - ci())%N+N)%N; if(d > N/2) d -= N; ciRaw += d; $("#cname").textContent = BL[ci()].name; }
$("#prev").onclick = ()=>{ ciRaw -= 1; $("#cname").textContent = BL[ci()].name; };
$("#next").onclick = ()=>{ ciRaw += 1; $("#cname").textContent = BL[ci()].name; };
$("#cname").textContent = BL[0].name;

function setHover(g){
  if(hov === g) return;
  if(hov) hov.traverse(o=>{ if(o.isMesh){ o.material.emissive.copy(o.material.userData.e0); o.material.emissiveIntensity = o.material.userData.i0; } });
  hov = g;
  if(g) g.traverse(o=>{ if(o.isMesh && o.material.userData.e0){ o.material.emissive.copy(HILITE); o.material.emissiveIntensity = o.material.transparent ? .7 : .45; } });
  if(!g){ tip.style.opacity = 0; document.body.style.cursor = ""; }
}
const tv = new THREE.Vector3(), lp = new THREE.Vector3();
function frame(t){
  requestAnimationFrame(frame);
  if(!($("#carousel").classList.contains("on")||$("#building").classList.contains("on"))) return;
  ringAng += (-ciRaw*step - ringAng)*.09; ring.rotation.y = ringAng;
  models.forEach((m,i)=>{
    const sel = mode==="detail" && i===cb;
    m.rotation.y = m.userData.th + (sel ? userRot + .12*Math.sin(t/2200) : .4*Math.sin(t/2400+i));
    m.userData.levels.forEach(g=>{
      if(sel){ lp.copy(cam.position); m.worldToLocal(lp); lp.y = 0; lp.normalize().multiplyScalar(g===hov ? .6 : 0); }
      else lp.set(0,0,0);
      g.userData.off.lerp(lp,.15); g.position.x = g.userData.off.x; g.position.z = g.userData.off.z;
    });
  });
  if(mode==="detail"){ camPos.set(0,3.7,R+dD); camLook.set(0,2.5,R); } else { camPos.set(0,4.8,R+dC); camLook.set(0,2.7,R*.5); }
  cam.position.lerp(camPos,.07); tv.lerp(camLook,.07); cam.lookAt(tv);
  renderer.render(scene,cam);
}
tv.copy(camLook); requestAnimationFrame(frame);

/* picking + gestures */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e,objs){
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,cam);
  const h = ray.intersectObjects(objs,true); if(!h.length) return null;
  let o = h[0].object, lvl = null, mdl = null;
  while(o){ if(o.userData.lvl !== undefined && !lvl) lvl = o; if(o.userData.mi !== undefined){ mdl = o; break; } o = o.parent; }
  return {lvl, mdl};
}
const live = () => $("#carousel").classList.contains("on") || $("#building").classList.contains("on");
let sx = null, sy = 0, lastx = 0, moved = false;
addEventListener("pointerdown", e=>{ if(!live() || e.target.closest("button")) return; sx = lastx = e.clientX; sy = e.clientY; moved = false; });
addEventListener("pointermove", e=>{
  if(!live()) return;
  if(sx !== null){
    if(Math.abs(e.clientX-sx) > 8) moved = true;
    if(moved && mode==="detail") userRot += (e.clientX-lastx)*.012; lastx = e.clientX;
  }
  if(mode==="detail" && sx===null && e.pointerType==="mouse"){
    const p = pick(e,[models[cb]]);
    if(p && p.lvl){ setHover(p.lvl); const n = p.lvl.userData.n, l = p.lvl.userData.lvl;
      tip.innerHTML = `Level ${l+1}<em>${l===n-1?"Penthouse level":"Residence"}</em>`; tip.style.opacity = 1; document.body.style.cursor = "pointer"; }
    else setHover(null);
    tip.style.left = (e.clientX+16)+"px"; tip.style.top = (e.clientY-10)+"px";
  }
});
addEventListener("pointerup", e=>{
  if(sx === null) return; const dx = e.clientX - sx; sx = null;
  if(!live()) return;
  if(mode==="carousel"){
    if(Math.abs(dx) > 45){ ciRaw += dx<0 ? 1 : -1; $("#cname").textContent = BL[ci()].name; return; }
    if(!moved){ const p = pick(e,models.filter(m=>m.visible)); if(p && p.mdl){ const i = p.mdl.userData.mi; if(i===ci()) openB(i); else spin(i); } }
  } else if(!moved){
    const p = pick(e,[models[cb]]);
    if(p && p.lvl){ setHover(null); openPlan(p.lvl.userData.lvl+1); }
  }
});
function openB(i){ spin(i); cb = i; userRot = 0; $("#bname").textContent = BL[i].name; go("building"); }
function openPlan(lvl){ $("#ptitle").textContent = `${BL[cb].name} · Level ${lvl}`; buildScenes(); drawPlan(); go("plan"); }

/* ================= isometric floor plan ================= */
const ROOMS = [
  {n:"Living",  s:0, r:[0,0,9,10],  c:"#c9b38a"},
  {n:"Kitchen", s:1, r:[9,0,6,5],   c:"#8b6a45"},
  {n:"Dining",  s:0, r:[9,5,6,5],   c:"#b89f77"},
  {n:"Bedroom", s:1, r:[15,0,7,6],  c:"#a9b5c9"},
  {n:"Spa",     s:1, r:[15,6,7,4],  c:"#7e8a8f"}
];
const K = 15, OX = 350, OY = 70;
const P = (x,y,z=0) => [OX + (x-y)*K*.866, OY + (x+y)*K*.5 - z*K];
const poly = pts => pts.map(p=>P(...p).join(",")).join(" ");
function drawPlan(){
  let s = "", WH = 1.6;
  [...ROOMS].sort((a,b)=>(a.r[0]+a.r[1])-(b.r[0]+b.r[1])).forEach(o=>{
    const [x,y,w,d] = o.r, x1=x+w, y1=y+d;
    s += `<g class="room" data-s="${o.s}"><polygon points="${poly([[x,y],[x1,y],[x1,y1],[x,y1]])}" fill="${o.c}" stroke="#30271d"/>`;
    s += `<polygon points="${poly([[x,y,0],[x1,y,0],[x1,y,WH],[x,y,WH]])}" fill="#efe6d2" stroke="#30271d" stroke-width=".6"/>`;
    s += `<polygon points="${poly([[x,y,0],[x,y1,0],[x,y1,WH],[x,y,WH]])}" fill="#d9cfb8" stroke="#30271d" stroke-width=".6"/>`;
    const [lx,ly] = P(x+w/2,y+d/2,.2); s += `<text class="lbl" x="${lx}" y="${ly}">${o.n}</text></g>`;
  });
  $("#psvg").innerHTML = s;
  $("#psvg").querySelectorAll(".room").forEach(g=>g.addEventListener("click",()=>{ cur = +g.dataset.s % BL[cb].sc.length; go("tour"); }));
}

/* ================= room tour ================= */
function buildScenes(){
  const b = BL[cb]; $("#scenes").innerHTML = ""; $("#tabs").innerHTML = "";
  b.sc.forEach((sc,i)=>{
    const d = document.createElement("div"); d.className = "scene"; d.style.backgroundImage = `url(${sc.url})`; $("#scenes").appendChild(d);
    const t = document.createElement("button"); t.textContent = i+1; t.onclick = ()=>show(i); $("#tabs").appendChild(t);
  });
  $("#tabs").style.display = b.sc.length>1 ? "flex" : "none"; cur = 0;
}
function show(i){
  cur = i;
  document.querySelectorAll(".scene").forEach((e,j)=>e.classList.toggle("on", j===i));
  document.querySelectorAll("#tabs button").forEach((e,j)=>e.classList.toggle("on", j===i));
  $("#cti").textContent = BL[cb].sc[i].t; $("#csm").textContent = $("#ptitle").textContent;
}
addEventListener("keydown", e=>{
  const on = id => $("#"+id).classList.contains("on");
  if(on("carousel")){ if(e.key==="ArrowRight") $("#next").click(); if(e.key==="ArrowLeft") $("#prev").click(); if(e.key==="Enter") openB(ci()); }
  else if(on("tour")){ const n = BL[cb].sc.length; if(e.key==="ArrowRight") show((cur+1)%n); if(e.key==="ArrowLeft") show((cur+n-1)%n); }
});
</script>
</body>
</html>
